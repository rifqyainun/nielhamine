<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santri Cash - Glassmorphism</title>
    
    <!-- Google Font Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background: linear-gradient(135deg, #0F52BA, #2563EB, #38BDF8);
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Glow Effects (Belakang) */
        body::before {
            content: '';
            position: fixed;
            width: 350px;
            height: 350px;
            background: #60A5FA;
            border-radius: 50%;
            top: -100px;
            left: -100px;
            filter: blur(100px);
            z-index: 1;
        }

        body::after {
            content: '';
            position: fixed;
            width: 300px;
            height: 300px;
            background: #1D4ED8;
            border-radius: 50%;
            bottom: -100px;
            right: -100px;
            filter: blur(120px);
            z-index: 1;
        }

        /* Glass Card Utama */
        .card {
            position: relative;
            width: 100%;
            max-width: 420px;
            padding: 28px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.4);
            color: white;
            overflow: hidden;
            z-index: 10;
        }

        .wave {
            position: absolute;
            width: 500px;
            height: 500px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            top: -250px;
            right: -180px;
            pointer-events: none;
        }

        /* Header Logo */
        .logo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .logo h2 {
            font-size: 22px;
            font-weight: 600;
        }

        .logo span {
            font-size: 30px;
        }

        .small {
            opacity: 0.8;
            font-size: 13px;
        }

        /* Total Saldo Display */
        .saldo {
            font-size: 34px;
            font-weight: 700;
            margin-top: 5px;
            letter-spacing: 1px;
            word-break: break-all;
        }

        /* Stat Pemasukan & Pengeluaran */
        .info {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            padding-bottom: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .item p {
            font-size: 13px;
            opacity: 0.8;
        }

        .item h3 {
            margin-top: 4px;
            font-size: 16px;
            font-weight: 600;
        }

        /* Form Input Section */
        .form-section {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-section h4 {
            font-size: 14px;
            opacity: 0.9;
            font-weight: 500;
            margin-bottom: 2px;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: white;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        input:focus, select:focus {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        select option {
            background: #1D4ED8;
            color: white;
        }

        .btn-submit {
            background: linear-gradient(135deg, #F97316, #EA580C);
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            padding: 14px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(234, 88, 12, 0.35);
            transition: all 0.3s;
            margin-top: 5px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(234, 88, 12, 0.5);
        }

        /* Mutasi Terakhir / History List */
        .history {
            margin-top: 30px;
        }

        .history h4 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        li {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 16px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
        }

        li:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        .info-keterangan {
            font-weight: 500;
            font-size: 14px;
        }

        .info-tanggal {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 2px;
        }

        .amount-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nominal {
            font-weight: 600;
            font-size: 14px;
        }

        .masuk {
            color: #86EFAC;
        }

        .keluar {
            color: #FCA5A5;
        }

        .btn-hapus {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #FCA5A5;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            transition: 0.2s;
        }

        .btn-hapus:hover {
            background: #EF4444;
            color: white;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="wave"></div>

        <!-- Logo -->
        <div class="logo">
            <h2>💳 Santri Cash</h2>
            <span>💠</span>
        </div>

        <!-- Ringkasan Saldo Utama -->
        <p class="small">Total Saldo</p>
        <div class="saldo" id="saldo">Rp 0</div>

        <!-- Statistik Masuk & Keluar -->
        <div class="info">
            <div class="item">
                <p>Pemasukan</p>
                <h3 id="total-masuk" style="color:#86EFAC">+ Rp 0</h3>
            </div>
            <div class="item">
                <p>Pengeluaran</p>
                <h3 id="total-keluar" style="color:#FCA5A5">- Rp 0</h3>
            </div>
        </div>

        <!-- Form Tambah Transaksi -->
        <div class="form-section">
            <h4>Catat Transaksi Baru</h4>
            <input type="text" id="keterangan" placeholder="Keterangan (misal: Kiriman, Beli Kitab)" autocomplete="off">
            <input type="number" id="jumlah" placeholder="Nominal (misal: 50000)">
            <select id="jenis">
                <option value="keluar">Pengeluaran (-)</option>
                <option value="masuk">Pemasukan (+)</option>
            </select>
            <button class="btn-submit" onclick="tambahData()">Catat Transaksi</button>
        </div>

        <!-- Mutasi Terakhir -->
        <div class="history">
            <h4>Mutasi Terakhir</h4>
            <ul id="list-transaksi">
                <!-- Data akan dirender oleh JavaScript -->
            </ul>
        </div>
    </div>

    <script>
        let transaksi = JSON.parse(localStorage.getItem('santriCashData')) || [];

        const formatRupiah = (angka) => {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0
            }).format(angka);
        };

        function renderUI() {
            const list = document.getElementById('list-transaksi');
            list.innerHTML = '';

            let totalPemasukan = 0;
            let totalPengeluaran = 0;

            const reversedTransaksi = [...transaksi].reverse();

            if (reversedTransaksi.length === 0) {
                list.innerHTML = '<p style="text-align:center; opacity:0.7; font-size:13px; padding: 10px 0;">Belum ada catatan transaksi.</p>';
            }

            reversedTransaksi.forEach((item, reversedIndex) => {
                const li = document.createElement('li');
                const isMasuk = item.jenis === 'masuk';
                const sign = isMasuk ? '+' : '-';
                const colorClass = isMasuk ? 'masuk' : 'keluar';

                const originalIndex = transaksi.length - 1 - reversedIndex;

                li.innerHTML = `
                    <div>
                        <div class="info-keterangan">${item.keterangan}</div>
                        <div class="info-tanggal">${item.tanggal}</div>
                    </div>
                    <div class="amount-group">
                        <span class="nominal ${colorClass}">${sign} ${formatRupiah(item.jumlah)}</span>
                        <button class="btn-hapus" onclick="hapusData(${originalIndex})" title="Hapus">✕</button>
                    </div>
                `;
                list.appendChild(li);
            });

            // Kalkulasi Total Saldo, Pemasukan, dan Pengeluaran
            transaksi.forEach(item => {
                if (item.jenis === 'masuk') {
                    totalPemasukan += item.jumlah;
                } else {
                    totalPengeluaran += item.jumlah;
                }
            });

            const totalSaldo = totalPemasukan - totalPengeluaran;

            // Update UI Ringkasan
            document.getElementById('saldo').innerText = formatRupiah(totalSaldo);
            document.getElementById('total-masuk').innerText = '+ ' + formatRupiah(totalPemasukan);
            document.getElementById('total-keluar').innerText = '- ' + formatRupiah(totalPengeluaran);
        }

        function tambahData() {
            const keterangan = document.getElementById('keterangan').value.trim();
            const jumlah = parseInt(document.getElementById('jumlah').value);
            const jenis = document.getElementById('jenis').value;

            if (!keterangan || isNaN(jumlah) || jumlah <= 0) {
                alert("Mohon isi keterangan dan nominal uang dengan benar!");
                return;
            }

            const now = new Date();
            const tanggal = now.toLocaleDateString('id-ID', { day: '2-digit', month: 'short' }) + ', ' + 
                            now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

            const dataBaru = {
                keterangan: keterangan,
                jumlah: jumlah,
                jenis: jenis,
                tanggal: tanggal
            };

            transaksi.push(dataBaru);
            localStorage.setItem('santriCashData', JSON.stringify(transaksi));

            document.getElementById('keterangan').value = '';
            document.getElementById('jumlah').value = '';

            renderUI();
        }

        function hapusData(index) {
            if (confirm("Hapus catatan transaksi ini?")) {
                transaksi.splice(index, 1);
                localStorage.setItem('santriCashData', JSON.stringify(transaksi));
                renderUI();
            }
        }

        // Render UI pertama kali saat aplikasi dibuka
        renderUI();
    </script>
</body>
</html>
